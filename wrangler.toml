# wrangler.toml (optimized for youtube-caption-extractor)
name = "youtube-caption-extractor"
main = "src/worker.ts"
compatibility_date = "2024-05-02"

# Node.js compatibility
node_compat = true

# Build settings
[build]
command = "npm run build"
watch_dir = "src"

# Environment
workers_dev = true

# Timeout settings (YouTube API calls might take time)
[limits]
cpu_ms = 50
subrequests = 50

# Environment Variables
[vars]
# Add any API keys or config here
# YOUTUBE_API_KEY = "your-api-key"

# Observability
[observability]
enabled = true
head_sampling_rate = 1
